  .group-heading .total { font-size: 15px; font-weight: 700; color: var(--seal); }

  .section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
  .section-header { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: none; border: none; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .section-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--paper-deep); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }

  .chevron.open { transform: rotate(180deg); }
  .section-body { padding: 0 16px 8px; border-top: 1px solid var(--line); }

  .stepper-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; gap: 12px; border-top: 1px solid var(--line); }

  .stepper-label { font-size: 13.5px; line-height: 1.4; }

  .stepper-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper-deep); color: var(--ink); font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function getPath(obj, path) {
  var parts = path.split(".");
  var cur = obj;
  for (var i = 0; i < parts.length; i++) { cur = cur[parts[i]]; if (cur == null) return 0; }
  return cur;
}
function setPath(obj, path, value) {
  var parts = path.split(".");
  var cur = obj;
  for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = value;
}
function n(v) { return Number.isFinite(v) ? v : 0; }
function cap(v, m) { return Math.min(v, m); }
function esc(s) { return String(s); }

function tierPts(t) { return t.mult ? t.mult(n(getPath(state, t.path))) : n(getPath(state, t.path)) * t.pts; }
function sectionPts(sec) {
  var total = 0;
  for (var i = 0; i < sec.tiers.length; i++) total += tierPts(sec.tiers[i]);
  if (sec.cap != null) total = cap(total, sec.cap);
  return total;
}

function groupTotal(list) { var t = 0; for (var i = 0; i < list.length; i++) t += sectionPts(list[i]); return t; }

function renderStepper(t) {
  var val = n(getPath(state, t.path));
  var oldMode = t.path.indexOf("old.") === 0;
  return (
    '<div class="stepper-row">' +
      '<div><p class="stepper-label">' + esc(t.label) + '</p>' +
      (t.ptsLabel ? '<p class="stepper-pts">' + esc(t.ptsLabel) + '</p>' : '') + '</div>' +
      '<div class="stepper-ctrl">' +
        '<button class="stepper-btn" data-step="' + t.path + '" data-delta="-1" aria-label="減らす">－</button>' +
        '<span class="stepper-val">' + val + '</span>' +
        '<button class="stepper-btn plus' + (oldMode ? ' old' : '') + '" data-step="' + t.path + '" data-delta="1" aria-label="増やす">＋</button>' +
      '</div>' +
    '</div>'
  );
}

function renderSection(sec, oldMode) {
  var open = !!openSections[sec.id];
  var pts = sectionPts(sec);
  var ptsClass = pts > 0 ? (oldMode ? "section-pts has old" : "section-pts has") : "section-pts";
  var body = "";
  for (var i = 0; i < sec.tiers.length; i++) body += renderStepper(sec.tiers[i]);
  return (
    '<div class="section">' +
      '<button class="section-header" data-toggle="' + sec.id + '">' +
        '<div class="section-icon">' + sec.icon + '</div>' +
        '<div class="section-title"><p class="t">' + esc(sec.title) + '</p>' +
        (sec.sub ? '<p class="s">' + esc(sec.sub) + '</p>' : '') + '</div>' +
        '<span class="' + ptsClass + '">' + pts + 'P</span>' +
        '<span class="chevron' + (open ? " open" : "") + '">▾</span>' +
      '</button>' +
      (open ? '<div class="section-body">' + body + '</div>' : '') +
    '</div>'
  );
}

function renderGroupHeading(label, desc, total, oldMode) {
  return (
    '<div class="group-heading">' +
      '<div><span class="label">' + esc(label) + '</span><span class="desc">' + esc(desc) + '</span></div>' +
      '<span class="total' + (oldMode ? " old" : "") + '">' + total + 'P</span>' +
    '</div>'
  );
}

function computeAll() {
  var groupI = groupTotal(NEW_SECTIONS);
  var groupII = groupTotal(NEW_SECTIONS_2);
  var newTotal = groupI + groupII;

  var oG1 = groupTotal(OLD_SECTIONS_1);
  var oG2 = groupTotal(OLD_SECTIONS_2);
  var oG3 = groupTotal(OLD_SECTIONS_3);
  var oG4 = groupTotal(OLD_SECTIONS_4);
  var oldTotal = oG1 + oG2 + oG3 + oG4;

  var usesMigration = state.migrationActive && newTotal < 30;
  var grandTotal = usesMigration ? newTotal + oldTotal : newTotal;

  var hasCongress = n(state.item1.national) + n(state.item1.branch) + n(state.item4) > 0;
  var hasDesignated = n(state.item2.designated) >= 2;
  var meetsPoints = grandTotal >= 30;
  var eligible = meetsPoints && hasCongress && hasDesignated;

  return { groupI: groupI, groupII: groupII, newTotal: newTotal, oG1: oG1, oG2: oG2, oG3: oG3, oG4: oG4, oldTotal: oldTotal, usesMigration: usesMigration, grandTotal: grandTotal, hasCongress: hasCongress, hasDesignated: hasDesignated, meetsPoints: meetsPoints, eligible: eligible };
}

function render() {
  var c = computeAll();

  var html = '<div class="wrap">';

  html += '<div class="header"><p class="eyebrow">JMTA CERTIFICATION</p>' +
    '<h1>認定音楽療法士<br>資格更新 判定ツール</h1>' +
    '<p class="desc">2025年4月改定の新規則と、移行期間中に合算できる旧規則（〜2025年3月）の両方に対応しています。</p></div>';

  html += '<div class="stamp-wrap"><div class="stamp-card">' +
    '<div class="stamp-badge' + (c.eligible ? ' ok' : '') + '">' + (c.eligible ? '✓' : '⚠') + '</div>' +
    '<div><p class="stamp-title" style="color:' + (c.eligible ? 'var(--seal-deep)' : 'var(--ink)') + '">' + (c.eligible ? '更新可能の見込み' : '条件未達（猶予申請の検討へ）') + '</p>' +
    '<p class="stamp-sub">合計 ' + c.grandTotal + 'P（新規則 ' + c.newTotal + 'P' + (c.usesMigration ? ' + 旧規則 ' + c.oldTotal + 'P' : '') + '） / 必要 30P</p></div>' +
    '</div>' +
    '<div class="conditions">' +
      '<div class="cond-row"><div class="cond-dot' + (c.meetsPoints ? ' ok' : '') + '">' + (c.meetsPoints ? '✓' : '') + '</div><span class="cond-text' + (c.meetsPoints ? ' ok' : '') + '">合計30ポイント以上（Ⅰ群のみ、またはⅠ群＋Ⅱ群。移行期間は旧規則ポイントを合算可）</span></div>' +
      '<div class="cond-row"><div class="cond-dot' + (c.hasCongress ? ' ok' : '') + '">' + (c.hasCongress ? '✓' : '') + '</div><span class="cond-text' + (c.hasCongress ? ' ok' : '') + '">学術大会（本学会・支部・世界大会）に参加している</span></div>' +
      '<div class="cond-row"><div class="cond-dot' + (c.hasDesignated ? ' ok' : '') + '">' + (c.hasDesignated ? '✓' : '') + '</div><span class="cond-text' + (c.hasDesignated ? ' ok' : '') + '">資格更新指定講座を2講座以上受講している</span></div>' +
    '</div></div>';

  html += '<div class="migration-box"><label>' +
    '<input type="checkbox" id="migrationCheckbox"' + (state.migrationActive ? ' checked' : '') + '>' +
    '<span>2025〜2029年度の更新で、<span class="old-tag">旧規則（2025年3月31日まで）</span>のポイントを項目ごとに入力して合算したい</span>' +
    '</label><p class="hint">新規則のみで30P以上ある場合、旧規則ポイントは自動的に合算されません。</p></div>';

  html += '<div class="group-block">' + renderGroupHeading("Ⅰ群（新）", "学術大会参加・運営／講習会受講", c.groupI, false);
  for (var i = 0; i < NEW_SECTIONS.length; i++) html += renderSection(NEW_SECTIONS[i], false);
  html += '</div>';

  html += '<div class="group-block">' + renderGroupHeading("Ⅱ群（新）", "研究発表・講師・論文投稿等", c.groupII, false);
  for (var j = 0; j < NEW_SECTIONS_2.length; j++) html += renderSection(NEW_SECTIONS_2[j], false);
  html += '</div>';

  if (state.migrationActive) {
    html += '<div class="group-block" style="margin-top:32px;">';
    html += '<div class="old-divider"><p>旧規則（〜2025年3月31日取得分）</p></div>';
    html += renderGroupHeading("Ⅰ群（旧）", "学術大会・研修会・講習会受講", c.oG1, true);
    for (var k = 0; k < OLD_SECTIONS_1.length; k++) html += renderSection(OLD_SECTIONS_1[k], true);

    html += renderGroupHeading("Ⅱ群（旧）", "研究発表", c.oG2, true);
    for (var m = 0; m < OLD_SECTIONS_2.length; m++) html += renderSection(OLD_SECTIONS_2[m], true);

    html += renderGroupHeading("Ⅲ群（旧）", "研究論文・著書", c.oG3, true);
    for (var p = 0; p < OLD_SECTIONS_3.length; p++) html += renderSection(OLD_SECTIONS_3[p], true);

    html += renderGroupHeading("Ⅳ群（旧）", "臨床および教育実践", c.oG4, true);
    for (var q = 0; q < OLD_SECTIONS_4.length; q++) html += renderSection(OLD_SECTIONS_4[q], true);
    html += '</div>';
  }

  html += '<div class="docs-toggle"><button id="docsToggleBtn">ℹ ' + (showDocs ? '必要書類の一覧を閉じる' : '各項目の必要書類を見る') + '</button>';
  if (showDocs) {
    html += '<div class="docs-panel">' +
      '<p class="h">新規則</p>' +
      '<p>1・4：参加証明書　2・5・6：受講証　3：実行委員会組織図または実行委員証明書</p>' +
      '<p>7〜9：プログラム等のコピー／発表証明書　10・11：目次と筆者がわかる箇所のコピー（11は投稿規定・倫理要綱も）　12：プログラム等のコピー</p>' +
      '<p class="h" style="margin-top:8px;">旧規則</p>' +
      '<p>⑴⑵⑶⑷：参加証・受講証（無記名は要記名）　⑺：単位取得証明書　⑻⑼⑽：発表証明・抄録コピー・プログラム　⑾⑿：投稿規定と抜き刷り（または本文・表紙・目次コピー）　⒀：著者名・目次・出版社・出版日がわかる部分のコピー　⒁：症例報告書（SKF/SKG）　⒂：スーパービジョン終了報告書（SKH）　⒃：教育終了報告書（SKI）</p>' +
      '</div>';
  }
  html += '</div>';

  html += '<div class="footer"><button class="reset-btn" id="resetBtn">↺ 入力をリセット</button>' +
    '<p class="disclaimer">本ツールは日本音楽療法学会の公式サイト掲載情報をもとに作成した非公式の目安計算です。正式な判定・申請は学会発行の規則書および会員ポータルサイトでご確認ください。入力内容はこの端末のブラウザ内にのみ保存されます（他の人とは共有されません）。</p></div>';

  html += '</div>';

  document.getElementById("app").innerHTML = html;

  if (state.migrationActive) {
    var univSec = document.querySelector('[data-toggle="o6"]');
    if (univSec && openSections["o6"]) {
      var body = univSec.parentElement.querySelector(".section-body");
      if (body) {
        body.innerHTML = '<div class="num-row"><span class="stepper-label" style="flex:1;">取得単位数</span>' +
          '<input class="num-input" type="number" min="0" id="univCreditsInput" value="' + n(state.old.univCredits) + '">' +
          '<span class="stepper-pts" style="margin-left:-4px;">単位（2単位ごとに5P・上限20P）</span></div>';
        document.getElementById("univCreditsInput").addEventListener("input", function (e) {
          var v = parseInt(e.target.value, 10);
          state.old.univCredits = isNaN(v) ? 0 : Math.max(0, v);
          saveState();
          render();
        });
      }
    }
  }
}

document.addEventListener("click", function (e) {
  var stepBtn = e.target.closest("[data-step]");
  if (stepBtn) {
    var path = stepBtn.getAttribute("data-step");
    var delta = parseInt(stepBtn.getAttribute("data-delta"), 10);
    var cur = n(getPath(state, path));
    var next = Math.max(0, cur + delta);
    setPath(state, path, next);
    saveState();
    render();
    return;
  }
  var toggleBtn = e.target.closest("[data-toggle]");
  if (toggleBtn) {
    var id = toggleBtn.getAttribute("data-toggle");
    openSections[id] = !openSections[id];
    render();
    return;
  }
  if (e.target.id === "docsToggleBtn") {
    showDocs = !showDocs;
    render();
    return;
  }
  if (e.target.id === "resetBtn") {
    state = freshState();
    saveState();
    render();
    return;
  }
});

document.addEventListener("change", function (e) {
  if (e.target.id === "migrationCheckbox") {
    state.migrationActive = e.target.checked;
    saveState();
    render();
  }
});

render();
</script>
</body>
</html>
