<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>認定音楽療法士 資格更新 判定ツール</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// ---- tiny localStorage wrapper matching the async shape used below ----
const storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    return v == null ? null : { value: v };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { ok: true };
  },
};

// ---- simple emoji-based icon components (no external icon library needed) ----
const mkIcon = (glyph) => ({ size = 16, className = "", style = {} }) =>
  React.createElement(
    "span",
    { className, style: { fontSize: size, lineHeight: 1, display: "inline-block", ...style } },
    glyph
  );
const ChevronDown = mkIcon("▾");
const Plus = mkIcon("＋");
const Minus = mkIcon("－");
const BadgeCheck = mkIcon("✓");
const AlertTriangle = mkIcon("⚠");
const BookOpen = mkIcon("📘");
const Users = mkIcon("👥");
const Mic2 = mkIcon("🎤");
const FileText = mkIcon("📄");
const GraduationCap = mkIcon("🎓");
const Globe2 = mkIcon("🌐");
const RotateCcw = mkIcon("↺");
const Info = mkIcon("ℹ");
const Archive = mkIcon("🗄");
const Stethoscope = mkIcon("🩺");

// ---- palette (official-document / hanko-stamp direction) ----
const INK = "#1c2b3a";
const PAPER = "#f6f1e4";
const PAPER_DEEP = "#efe7d3";
const SEAL = "#a8322d";
const SEAL_DEEP = "#7f2420";
const GOLD = "#9c7a2e";
const LINE = "#d8cdae";
const OLD_TINT = "#3d4f42";

const num = (v) => (Number.isFinite(v) ? v : 0);
const cap = (v, m) => Math.min(v, m);

const initialState = {
  item1: { national: 0, branch: 0 },
  item2: { general: 0, designated: 0 },
  item3: { national: 0, branch: 0 },
  item4: 0,
  item5: 0,
  item6: 0,
  item7: 0,
  item8: 0,
  item9: 0,
  item10: { original: 0, short: 0, review: 0, coauthor: 0 },
  item11: { original: 0, short: 0, review: 0, coauthor: 0 },
  item12: 0,
  migrationActive: false,
  old: {
    congressMain: 0,
    congressBranch: 0,
    lectureMain: { long: 0, short: 0 },
    lectureOrg: { long: 0, short: 0 },
    overseas: 0,
    relatedCongress: 0,
    univCredits: 0,
    presMain: { general: 0, organizer: 0, instructor: 0 },
    presOrg: { general: 0, organizer: 0, instructor: 0 },
    presRelated: 0,
    journalMain: { original: 0, short: 0, feature: 0, material: 0, review: 0 },
    journalOrg: { doctor: 0, original: 0, short: 0, material: 0 },
    book: {
      originalEquiv: 0,
      other: 0,
      series: 0,
      coauthorOver10: 0,
      coauthorUnder10: 0,
      translateOver10: 0,
      translateUnder10: 0,
    },
    clinicalMain: 0,
    clinicalSub: 0,
    supervision: 0,
    educationYears: 0,
  },
};

function Stepper({ value, onChange, label, points, min = 0, accent = INK }) {
  return (
    <div className="flex items-center justify-between py-2.5 gap-3">
      <div className="min-w-0 flex-1">
        <p className="text-[13.5px] leading-snug" style={{ color: INK }}>{label}</p>
        {points != null && <p className="text-[11.5px] mt-0.5" style={{ color: GOLD }}>{points}</p>}
      </div>
      <div className="flex items-center gap-2 shrink-0">
        <button type="button" aria-label="減らす" onClick={() => onChange(Math.max(min, value - 1))}
          className="w-8 h-8 rounded-full flex items-center justify-center active:scale-95 transition"
          style={{ background: PAPER_DEEP, color: INK, border: `1px solid ${LINE}` }}>
          <Minus size={14} />
        </button>
        <span className="w-7 text-center tabular-nums text-[15px] font-semibold" style={{ color: INK }}>{value}</span>
        <button type="button" aria-label="増やす" onClick={() => onChange(value + 1)}
          className="w-8 h-8 rounded-full flex items-center justify-center active:scale-95 transition"
          style={{ background: accent, color: PAPER }}>
          <Plus size={14} />
        </button>
      </div>
    </div>
  );
}

function Section({ icon: Icon, title, sub, defaultOpen, children, points, accent = INK }) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div className="rounded-2xl overflow-hidden mb-3" style={{ background: "#fffdf8", border: `1px solid ${LINE}` }}>
      <button type="button" onClick={() => setOpen((o) => !o)} className="w-full flex items-center gap-3 px-4 py-3.5 text-left">
        <div className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: PAPER_DEEP, color: accent }}>
          <Icon size={17} />
        </div>
        <div className="flex-1 min-w-0">
          <p className="text-[14.5px] font-semibold" style={{ color: INK }}>{title}</p>
          {sub && <p className="text-[11.5px] mt-0.5" style={{ color: "#7a7360" }}>{sub}</p>}
        </div>
        <span className="text-[12.5px] font-bold tabular-nums shrink-0" style={{ color: points > 0 ? accent : "#a49c86" }}>{points}P</span>
        <ChevronDown size={16} className="shrink-0 transition-transform" style={{ color: "#a49c86", transform: open ? "rotate(180deg)" : "none" }} />
      </button>
      {open && (
        <div className="px-4 pb-3 divide-y" style={{ borderTop: `1px solid ${LINE}` }}>
          {children}
        </div>
      )}
    </div>
  );
}

function TierRow({ tiers, values, onChange, accent }) {
  return (
    <div className="divide-y" style={{ borderColor: LINE }}>
      {tiers.map((t) => (
        <div key={t.key} className="[&:not(:first-child)]:border-t" style={{ borderColor: LINE }}>
          <Stepper label={t.label} points={t.pts} value={values[t.key] || 0} onChange={(v) => onChange({ ...values, [t.key]: v })} accent={accent} />
        </div>
      ))}
    </div>
  );
}

function GroupHeading({ label, desc, total, accent = SEAL }) {
  return (
    <div className="flex items-end justify-between mb-2.5 px-1">
      <div>
        <span className="text-[13px] font-bold px-2 py-0.5 rounded" style={{ background: INK, color: PAPER }}>{label}</span>
        <span className="text-[11.5px] ml-2" style={{ color: "#7a7360" }}>{desc}</span>
      </div>
      <span className="text-[15px] font-bold tabular-nums" style={{ color: accent }}>{total}P</span>
    </div>
  );
}

function ConditionRow({ ok, text }) {
  return (
    <div className="flex items-center gap-2.5 px-1">
      <div className="w-4 h-4 rounded-full flex items-center justify-center shrink-0 text-[9px] font-bold"
        style={{ background: ok ? "#3f6b4f" : "transparent", border: ok ? "none" : `1.5px solid #b7ae92`, color: "#fff" }}>
        {ok ? "✓" : ""}
      </div>
      <span className="text-[12.5px]" style={{ color: ok ? "#3f6b4f" : "#7a7360" }}>{text}</span>
    </div>
  );
}

function App() {
  const [s, setS] = useState(initialState);
  const [loaded, setLoaded] = useState(false);
  const [showTable, setShowTable] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const r = await storage.get("jmta-renewal:v2");
        if (r && r.value) {
          const parsed = JSON.parse(r.value);
          setS({ ...initialState, ...parsed, old: { ...initialState.old, ...(parsed.old || {}) } });
        }
      } catch (e) {}
      finally { setLoaded(true); }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(async () => {
      try { await storage.set("jmta-renewal:v2", JSON.stringify(s)); } catch (e) {}
    }, 300);
    return () => clearTimeout(t);
  }, [s, loaded]);

  const set = useCallback((key, val) => setS((prev) => ({ ...prev, [key]: val })), []);
  const setOld = useCallback((key, val) => setS((prev) => ({ ...prev, old: { ...prev.old, [key]: val } })), []);

  const p1 = s.item1.national * 6 + s.item1.branch * 3;
  const p2 = (s.item2.general + s.item2.designated) * 2;
  const p3 = s.item3.national * 6 + s.item3.branch * 3;
  const p4 = s.item4 * 5;
  const p5 = s.item5 * 5;
  const p6 = s.item6 * 1;
  const groupI = p1 + p2 + p3 + p4 + p5 + p6;

  const p7 = s.item7 * 8;
  const p8 = s.item8 * 8;
  const p9 = s.item9 * 8;
  const p10 = s.item10.original * 10 + s.item10.short * 6 + s.item10.review * 3 + s.item10.coauthor * 1;
  const p11 = s.item11.original * 5 + s.item11.short * 3 + s.item11.review * 2 + s.item11.coauthor * 1;
  const p12 = s.item12 * 5;
  const groupII = p7 + p8 + p9 + p10 + p11 + p12;

  const newTotal = groupI + groupII;

  const o = s.old;
  const oG1 =
    o.congressMain * 5 + o.congressBranch * 5 +
    o.lectureMain.long * 5 + o.lectureMain.short * 2.5 +
    o.lectureOrg.long * 3 + o.lectureOrg.short * 1.5 +
    o.overseas * 5 + o.relatedCongress * 3 +
    cap(Math.floor(num(o.univCredits) / 2) * 5, 20);

  const oG2 =
    o.presMain.general * 8 + o.presMain.organizer * 8 + o.presMain.instructor * 10 +
    o.presOrg.general * 5 + o.presOrg.organizer * 8 + o.presOrg.instructor * 8 +
    o.presRelated * 5;

  const oG3 =
    o.journalMain.original * 10 + o.journalMain.short * 6 + o.journalMain.feature * 6 + o.journalMain.material * 3 + o.journalMain.review * 3 +
    o.journalOrg.doctor * 10 + o.journalOrg.original * 5 + o.journalOrg.short * 3 + o.journalOrg.material * 1 +
    o.book.originalEquiv * 15 + o.book.other * 10 + o.book.series * 10 +
    o.book.coauthorOver10 * 7 + o.book.coauthorUnder10 * 3 +
    o.book.translateOver10 * 7 + o.book.translateUnder10 * 3;

  const oG4Clinical = cap(o.clinicalMain * 5 + o.clinicalSub * 2, 30);
  const oG4Supervision = cap(o.supervision * 8, 16);
  const oG4Education = cap(o.educationYears * 8, 24);
  const oG4 = oG4Clinical + oG4Supervision + oG4Education;

  const oldTotal = oG1 + oG2 + oG3 + oG4;

  const usesMigration = s.migrationActive && newTotal < 30;
  const grandTotal = usesMigration ? newTotal + oldTotal : newTotal;

  const hasCongress = s.item1.national + s.item1.branch + s.item4 > 0;
  const hasDesignated = s.item2.designated >= 2;
  const meetsPoints = grandTotal >= 30;
  const eligible = meetsPoints && hasCongress && hasDesignated;

  const reset = async () => {
    setS(initialState);
    try { await storage.set("jmta-renewal:v2", JSON.stringify(initialState)); } catch (e) {}
  };

  return (
    <div className="min-h-screen w-full pb-10" style={{ background: PAPER, fontFamily: "'Hiragino Mincho ProN','Hiragino Sans','Yu Gothic',system-ui,sans-serif" }}>
      <div className="px-5 pt-7 pb-5 relative overflow-hidden" style={{ background: INK }}>
        <p className="text-[11px] tracking-[0.25em]" style={{ color: "#a9b6c4" }}>JMTA CERTIFICATION</p>
        <h1 className="text-[20px] font-bold mt-1 leading-snug" style={{ color: PAPER }}>
          認定音楽療法士<br />資格更新 判定ツール
        </h1>
        <p className="text-[11.5px] mt-2 leading-relaxed" style={{ color: "#8b98a6" }}>
          2025年4月改定の新規則と、移行期間中に合算できる旧規則（〜2025年3月）の両方に対応しています。
        </p>
      </div>

      <div className="px-5 -mt-4 relative z-10">
        <div className="rounded-2xl p-5 flex items-center gap-4" style={{ background: "#fffdf8", border: `1px solid ${LINE}`, boxShadow: "0 6px 20px rgba(28,43,58,0.12)" }}>
          <div className="w-16 h-16 rounded-full flex items-center justify-center shrink-0 border-[3px]"
            style={{ borderColor: eligible ? SEAL : "#c9c0a5", color: eligible ? SEAL : "#9a927a", transform: "rotate(-6deg)" }}>
            {eligible ? <BadgeCheck size={28} /> : <AlertTriangle size={26} />}
          </div>
          <div className="flex-1">
            <p className="text-[16.5px] font-bold" style={{ color: eligible ? SEAL_DEEP : INK }}>
              {eligible ? "更新可能の見込み" : "条件未達（猶予申請の検討へ）"}
            </p>
            <p className="text-[12px] mt-0.5" style={{ color: "#7a7360" }}>
              合計 {grandTotal}P（新規則 {newTotal}P{usesMigration ? ` + 旧規則 ${oldTotal}P` : ""}） / 必要 30P
            </p>
          </div>
        </div>

        <div className="mt-3 space-y-1.5">
          <ConditionRow ok={meetsPoints} text="合計30ポイント以上（Ⅰ群のみ、またはⅠ群＋Ⅱ群。移行期間は旧規則ポイントを合算可）" />
          <ConditionRow ok={hasCongress} text="学術大会（本学会・支部・世界大会）に参加している" />
          <ConditionRow ok={hasDesignated} text="資格更新指定講座を2講座以上受講している" />
        </div>
      </div>

      <div className="px-5 mt-5">
        <div className="rounded-2xl p-4" style={{ background: "#fffdf8", border: `1px solid ${LINE}` }}>
          <label className="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" checked={s.migrationActive} onChange={(e) => set("migrationActive", e.target.checked)} className="mt-0.5 w-4 h-4 shrink-0" />
            <span className="text-[13px] leading-snug" style={{ color: INK }}>
              2025〜2029年度の更新で、<span style={{ color: OLD_TINT, fontWeight: 600 }}>旧規則（2025年3月31日まで）</span>のポイントを項目ごとに入力して合算したい
            </span>
          </label>
          <p className="text-[11px] mt-2 pl-7 leading-relaxed" style={{ color: "#948c74" }}>
            新規則のみで30P以上ある場合、旧規則ポイントは自動的に合算されません。
          </p>
        </div>
      </div>

      <div className="px-5 mt-6">
        <GroupHeading label="Ⅰ群（新）" desc="学術大会参加・運営／講習会受講" total={groupI} />
        <Section icon={Users} title="1. 学術大会への参加" sub="全国大会 6P／支部大会 3P" points={p1} defaultOpen>
          <TierRow tiers={[{ key: "national", label: "全国大会（参加回数）", pts: "6P/件" }, { key: "branch", label: "支部大会（参加回数）", pts: "3P/件" }]} values={s.item1} onChange={(v) => set("item1", v)} />
        </Section>
        <Section icon={GraduationCap} title="2. 講習会・事例検討会の受講" sub="90〜180分未満 各2P（資格更新指定講座を2件以上含む必要あり）" points={p2}>
          <TierRow tiers={[{ key: "general", label: "一般の講習会・事例検討会", pts: "2P/件" }, { key: "designated", label: "資格更新指定講座（必須・2件以上）", pts: "2P/件" }]} values={s.item2} onChange={(v) => set("item2", v)} />
        </Section>
        <Section icon={Users} title="3. 学術大会の実行委員" sub="全国大会 6P／支部大会 3P（同一大会の参加ポイントとは併用不可）" points={p3}>
          <TierRow tiers={[{ key: "national", label: "全国大会（実行委員）", pts: "6P/件" }, { key: "branch", label: "支部大会（実行委員）", pts: "3P/件" }]} values={s.item3} onChange={(v) => set("item3", v)} />
        </Section>
        <Section icon={Globe2} title="4. 世界音楽療法連盟 学術大会参加" points={p4}>
          <Stepper label="参加回数" points="5P/件" value={s.item4} onChange={(v) => set("item4", v)} />
        </Section>
        <Section icon={Globe2} title="5. 世界音楽療法連盟 講習会受講" points={p5}>
          <Stepper label="受講回数" points="5P/件" value={s.item5} onChange={(v) => set("item5", v)} />
        </Section>
        <Section icon={BookOpen} title="6. 登録団体主催・支部認定の講習会受講" sub="90〜180分未満" points={p6}>
          <Stepper label="受講回数" points="1P/件" value={s.item6} onChange={(v) => set("item6", v)} />
        </Section>
      </div>

      <div className="px-5 mt-6">
        <GroupHeading label="Ⅱ群（新）" desc="研究発表・講師・論文投稿等" total={groupII} />
        <Section icon={Mic2} title="7. 学術大会での研究発表（筆頭演者）" sub="ポスター含む" points={p7}>
          <Stepper label="発表回数" points="8P/件" value={s.item7} onChange={(v) => set("item7", v)} />
        </Section>
        <Section icon={GraduationCap} title="8. 講習会の講師" points={p8}>
          <Stepper label="担当回数" points="8P/件" value={s.item8} onChange={(v) => set("item8", v)} />
        </Section>
        <Section icon={Users} title="9. シンポジウム等（企画者・シンポジスト・話題提供者・指定討論者等）" points={p9}>
          <Stepper label="回数" points="8P/件" value={s.item9} onChange={(v) => set("item9", v)} />
        </Section>
        <Section icon={FileText} title="10. 学会誌への投稿" sub="本学会／世界音楽療法連盟" points={p10}>
          <TierRow tiers={[{ key: "original", label: "原著・総説", pts: "10P/件" }, { key: "short", label: "小論文・特集記事", pts: "6P/件" }, { key: "review", label: "資料・書評", pts: "3P/件" }, { key: "coauthor", label: "共同執筆者（一律）", pts: "1P/件" }]} values={s.item10} onChange={(v) => set("item10", v)} />
        </Section>
        <Section icon={FileText} title="11. 研究誌への投稿" sub="支部・本学会登録団体" points={p11}>
          <TierRow tiers={[{ key: "original", label: "原著・総説", pts: "5P/件" }, { key: "short", label: "小論文・特集記事", pts: "3P/件" }, { key: "review", label: "資料・書評", pts: "2P/件" }, { key: "coauthor", label: "共同執筆者（一律）", pts: "1P/件" }]} values={s.item11} onChange={(v) => set("item11", v)} />
        </Section>
        <Section icon={GraduationCap} title="12. 登録団体主催・支部認定講習会の講師" points={p12}>
          <Stepper label="担当回数" points="5P/件" value={s.item12} onChange={(v) => set("item12", v)} />
        </Section>
      </div>

      {s.migrationActive && (
        <div className="px-5 mt-8">
          <div className="rounded-xl px-3 py-2 mb-3" style={{ background: OLD_TINT }}>
            <p className="text-[12px] font-bold tracking-wide" style={{ color: PAPER }}>旧規則（〜2025年3月31日取得分）</p>
          </div>

          <GroupHeading label="Ⅰ群（旧）" desc="学術大会・研修会・講習会受講" total={oG1} accent={OLD_TINT} />
          <Section icon={Users} title="⑴⑵ 学術大会への参加" sub="本学会大会・支部大会 各5P" points={o.congressMain * 5 + o.congressBranch * 5} accent={OLD_TINT}>
            <TierRow tiers={[{ key: "congressMain", label: "本学会学術大会（参加回数）", pts: "5P/件" }, { key: "congressBranch", label: "支部大会（参加回数）", pts: "5P/件" }]}
              values={{ congressMain: o.congressMain, congressBranch: o.congressBranch }}
              onChange={(v) => { setOld("congressMain", v.congressMain); setOld("congressBranch", v.congressBranch); }} accent={OLD_TINT} />
          </Section>
          <Section icon={GraduationCap} title="⑶ 学会・支部主催の講習会受講" sub="180分以上5P／90〜180分未満2.5P" points={o.lectureMain.long * 5 + o.lectureMain.short * 2.5} accent={OLD_TINT}>
            <TierRow tiers={[{ key: "long", label: "180分以上", pts: "5P/件" }, { key: "short", label: "90〜180分未満", pts: "2.5P/件" }]} values={o.lectureMain} onChange={(v) => setOld("lectureMain", v)} accent={OLD_TINT} />
          </Section>
          <Section icon={GraduationCap} title="⑷ 認定団体主催の講習会受講" sub="180分以上3P／90〜180分未満1.5P" points={o.lectureOrg.long * 3 + o.lectureOrg.short * 1.5} accent={OLD_TINT}>
            <TierRow tiers={[{ key: "long", label: "180分以上", pts: "3P/件" }, { key: "short", label: "90〜180分未満", pts: "1.5P/件" }]} values={o.lectureOrg} onChange={(v) => setOld("lectureOrg", v)} accent={OLD_TINT} />
          </Section>
          <Section icon={Globe2} title="⑸ 海外の大会・講習会参加" points={o.overseas * 5} accent={OLD_TINT}>
            <Stepper label="参加回数" points="5P/件" value={o.overseas} onChange={(v) => setOld("overseas", v)} accent={OLD_TINT} />
          </Section>
          <Section icon={Users} title="⑹ 関連学会主催の学術大会・講習会" points={o.relatedCongress * 3} accent={OLD_TINT}>
            <Stepper label="参加回数" points="3P/件" value={o.relatedCongress} onChange={(v) => setOld("relatedCongress", v)} accent={OLD_TINT} />
          </Section>
          <Section icon={GraduationCap} title="⑺ 国内外の大学・大学院での研修" sub="2単位＝5P（上限20P）" points={cap(Math.floor(num(o.univCredits) / 2) * 5, 20)} accent={OLD_TINT}>
            <Stepper label="取得単位数" points="2単位ごとに5P・上限20P" value={num(o.univCredits)} onChange={(v) => setOld("univCredits", v)} accent={OLD_TINT} />
          </Section>

          <GroupHeading label="Ⅱ群（旧）" desc="研究発表" total={oG2} accent={OLD_TINT} />
          <Section icon={Mic2} title="⑻ 本学会・支部・海外学会での発表" points={o.presMain.general * 8 + o.presMain.organizer * 8 + o.presMain.instructor * 10} accent={OLD_TINT}>
            <TierRow tiers={[{ key: "general", label: "一般発表（ポスター含む）", pts: "8P/件" }, { key: "organizer", label: "企画者・シンポジスト・指定討論者・話題提供者", pts: "8P/件" }, { key: "instructor", label: "講習会・研修会等の講師", pts: "10P/件" }]} values={o.presMain} onChange={(v) => setOld("presMain", v)} accent={OLD_TINT} />
          </Section>
          <Section icon={Mic2} title="⑼ 認定団体主催の講習会等での発表" points={o.presOrg.general * 5 + o.presOrg.organizer * 8 + o.presOrg.instructor * 8} accent={OLD_TINT}>
            <TierRow tiers={[{ key: "general", label: "一般発表（ポスター含む）", pts: "5P/件" }, { key: "organizer", label: "企画者・シンポジスト・指定討論者・話題提供者", pts: "8P/件" }, { key: "instructor", label: "講師参加", pts: "8P/件" }]} values={o.presOrg} onChange={(v) => setOld("presOrg", v)} accent={OLD_TINT} />
          </Section>
          <Section icon={Mic2} title="⑽ 関連学会主催大会での音楽療法に関する発表" points={o.presRelated * 5} accent={OLD_TINT}>
            <Stepper label="発表回数" points="5P/件" value={o.presRelated} onChange={(v) => setOld("presRelated", v)} accent={OLD_TINT} />
          </Section>

          <GroupHeading label="Ⅲ群（旧）" desc="研究論文・著書" total={oG3} accent={OLD_TINT} />
          <Section icon={FileText} title="⑾ 本学会誌・支部学会誌・関連学会誌等への論文" points={o.journalMain.original * 10 + o.journalMain.short * 6 + o.journalMain.feature * 6 + o.journalMain.material * 3 + o.journalMain.review * 3} accent={OLD_TINT}>
            <TierRow tiers={[{ key: "original", label: "原著・総説", pts: "10P/件" }, { key: "short", label: "小論文（事例研究含む）", pts: "6P/件" }, { key: "feature", label: "特集記事（学会誌のみ）", pts: "6P/件" }, { key: "material", label: "資料", pts: "3P/件" }, { key: "review", label: "書評（学会誌のみ）", pts: "3P/件" }]} values={o.journalMain} onChange={(v) => setOld("journalMain", v)} accent={OLD_TINT} />
          </Section>
          <Section icon={FileText} title="⑿ 登録研究団体誌・大学紀要・学位論文等" points={o.journalOrg.doctor * 10 + o.journalOrg.original * 5 + o.journalOrg.short * 3 + o.journalOrg.material * 1} accent={OLD_TINT}>
            <TierRow tiers={[{ key: "doctor", label: "博士論文", pts: "10P/件" }, { key: "original", label: "原著・総説・研究紀要・修士論文", pts: "5P/件" }, { key: "short", label: "小論文（事例研究含む）", pts: "3P/件" }, { key: "material", label: "資料", pts: "1P/件" }]} values={o.journalOrg} onChange={(v) => setOld("journalOrg", v)} accent={OLD_TINT} />
          </Section>
          <Section icon={Archive} title="⒀ 音楽療法関係の著書出版" sub="共著の場合は筆頭者以外、按分後の値を件数として入力" points={o.book.originalEquiv * 15 + o.book.other * 10 + o.book.series * 10 + o.book.coauthorOver10 * 7 + o.book.coauthorUnder10 * 3 + o.book.translateOver10 * 7 + o.book.translateUnder10 * 3} accent={OLD_TINT}>
            <TierRow tiers={[{ key: "originalEquiv", label: "原著に準ずるもの", pts: "15P/件" }, { key: "other", label: "その他の出版", pts: "10P/件" }, { key: "series", label: "講座等（各巻を1冊として）", pts: "10P/件" }, { key: "coauthorOver10", label: "分担執筆・10ページ以上", pts: "7P/件" }, { key: "coauthorUnder10", label: "分担執筆・10ページ未満", pts: "3P/件" }, { key: "translateOver10", label: "翻訳・10ページ以上", pts: "7P/件" }, { key: "translateUnder10", label: "翻訳・10ページ未満", pts: "3P/件" }]} values={o.book} onChange={(v) => setOld("book", v)} accent={OLD_TINT} />
          </Section>

          <GroupHeading label="Ⅳ群（旧）" desc="臨床および教育実践" total={oG4} accent={OLD_TINT} />
          <Section icon={Stethoscope} title="⒁ 有償の臨床経験" sub="主セラピスト5P／副セラピスト2P・症例（上限30P）" points={oG4Clinical} accent={OLD_TINT}>
            <TierRow tiers={[{ key: "clinicalMain", label: "主セラピスト（症例数）", pts: "5P/件" }, { key: "clinicalSub", label: "副セラピスト（症例数）", pts: "2P/件" }]}
              values={{ clinicalMain: o.clinicalMain, clinicalSub: o.clinicalSub }}
              onChange={(v) => { setOld("clinicalMain", v.clinicalMain); setOld("clinicalSub", v.clinicalSub); }} accent={OLD_TINT} />
          </Section>
          <Section icon={Users} title="⒂ スーパーバイジー／バイザー経験" sub="上限16P" points={oG4Supervision} accent={OLD_TINT}>
            <Stepper label="経験回数" points="8P/件・上限16P" value={o.supervision} onChange={(v) => setOld("supervision", v)} accent={OLD_TINT} />
          </Section>
          <Section icon={GraduationCap} title="⒃ 教育機関での音楽療法教育経験" sub="上限24P" points={oG4Education} accent={OLD_TINT}>
            <Stepper label="担当年数" points="8P/年・上限24P" value={o.educationYears} onChange={(v) => setOld("educationYears", v)} accent={OLD_TINT} />
          </Section>
        </div>
      )}

      <div className="px-5 mt-4">
        <button type="button" onClick={() => setShowTable((v) => !v)} className="flex items-center gap-2 text-[12.5px]" style={{ color: GOLD }}>
          <Info size={14} />
          {showTable ? "必要書類の一覧を閉じる" : "各項目の必要書類を見る"}
        </button>
        {showTable && (
          <div className="mt-2 rounded-xl p-3.5 text-[11.5px] leading-relaxed" style={{ background: "#fffdf8", border: `1px solid ${LINE}`, color: "#5c5644" }}>
            <p className="font-semibold" style={{ color: INK }}>新規則</p>
            <p>1・4：参加証明書　2・5・6：受講証　3：実行委員会組織図または実行委員証明書</p>
            <p className="mt-1">7〜9：プログラム等のコピー／発表証明書　10・11：目次と筆者がわかる箇所のコピー（11は投稿規定・倫理要綱も）　12：プログラム等のコピー</p>
            <p className="font-semibold mt-2" style={{ color: INK }}>旧規則</p>
            <p>⑴⑵⑶⑷：参加証・受講証（無記名は要記名）　⑺：単位取得証明書　⑻⑼⑽：発表証明・抄録コピー・プログラム　⑾⑿：投稿規定と抜き刷り（または本文・表紙・目次コピー）　⒀：著者名・目次・出版社・出版日がわかる部分のコピー　⒁：症例報告書（SKF/SKG）　⒂：スーパービジョン終了報告書（SKH）　⒃：教育終了報告書（SKI）</p>
          </div>
        )}
      </div>

      <div className="px-5 mt-6">
        <button type="button" onClick={reset} className="w-full flex items-center justify-center gap-2 py-3 rounded-xl text-[13px]" style={{ background: PAPER_DEEP, color: INK, border: `1px solid ${LINE}` }}>
          <RotateCcw size={14} />
          入力をリセット
        </button>
        <p className="text-[10.5px] mt-4 leading-relaxed text-center" style={{ color: "#a49c86" }}>
          本ツールは日本音楽療法学会の公式サイト掲載情報をもとに作成した非公式の目安計算です。
          正式な判定・申請は学会発行の規則書および会員ポータルサイトでご確認ください。
          入力内容はこの端末のブラウザ内にのみ保存されます（他の人とは共有されません）。
        </p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
